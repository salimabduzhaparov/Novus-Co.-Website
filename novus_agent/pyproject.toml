[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novus-agent"
version = "0.1.0"
description = "Novus Pipeline Agent - self-running lead research, grading, premium preview generation, and compliant cold outreach for Novus Co."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.79.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
higgsfield = ["mcp>=1.1"]
browser = ["playwright>=1.46"]
all = ["novus-agent[gmail,higgsfield,browser]"]

[project.scripts]
novus = "novus_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
